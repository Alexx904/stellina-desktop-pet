name: Build App (macOS & Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: Compile and Package Stellina.app
      run: |
        chmod +x scripts/build_app.sh
        ./scripts/build_app.sh

    - name: Compress App Bundle
      run: |
        cd build
        zip -r -y Stellina-macOS.zip Stellina.app

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stellina-macOS-App
        path: build/Stellina-macOS.zip

  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install PyInstaller
      run: python -m pip install --upgrade pip pyinstaller

    - name: Build Windows Executable
      run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1

    - name: Compress Windows Executable
      run: |
        Compress-Archive -Path build\Stellina-Windows\Stellina.exe -DestinationPath build\Stellina-Windows.zip

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stellina-Windows-App
        path: build\Stellina-Windows.zip
