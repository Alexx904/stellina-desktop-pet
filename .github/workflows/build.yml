name: Build App (macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS App (Universal)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Display Swift and Xcode Environment
      run: |
        swift --version
        xcodebuild -version || true

    - name: Cache Swift Package Manager (.build)
      uses: actions/cache@v4
      with:
        path: .build
        key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**/*.swift') }}
        restore-keys: |
          spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          spm-${{ runner.os }}-

    - name: Compile and Package Stellina.app
      run: |
        chmod +x scripts/build_app.sh
        ./scripts/build_app.sh

    - name: Compress App Bundle
      run: |
        cd build
        zip -r -y Stellina-macOS.zip Stellina.app

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stellina-macOS-App
        path: build/Stellina-macOS.zip
        if-no-files-found: error


